[project]
name = "parkcast"
version = "0.1.0"
requires-python = ">=3.13"
# `certifi` is not a new dependency -- `requests` has always pulled it in, and
# it is what `requests` uses as its CA bundle. It is named here because
# `sources.http` now imports it directly (to load the same roots into the two
# per-source SSLContexts), and an undeclared direct import would break the day
# `requests` stopped depending on it.
#
# `lightgbm` and `numpy` are Stage B's, and both are genuinely new. The NATIVE
# lightgbm API is what this project uses -- `train`, `Dataset`, `Booster` -- never
# the scikit-learn wrapper, which would pull scikit-learn and scipy in for
# nothing we call: roughly 90 MB against 22 MB. `numpy` did not arrive with
# anything else either; pyarrow 25 dropped its numpy requirement, so it has to be
# named here or the day pyarrow changes again the collector stops importing.
#
# Both belong to the COLLECTOR, not only the trainer, because inference runs
# in-process at publish time. That does put a C++ extension in the process that
# talks to six external feeds, which is why the model file it loads is a text
# dump whose digest is verified and never, under any circumstance, a pickle.
dependencies = [
    "requests>=2.32", "certifi", "pyarrow>=17", "pyproj>=3.6",
    "lightgbm>=4.5", "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The missing New Taipei intermediate travels with the package. `COPY src ./src`
# puts it in the build context, but the image installs with `pip install .`, so
# the collector imports `parkcast` out of site-packages, not out of `/app/src` --
# without this the .pem is in the image and still unreachable at runtime, and
# New Taipei fails exactly as it did before. Verified inside the built image.
[tool.setuptools.package-data]
"parkcast.sources" = ["*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
