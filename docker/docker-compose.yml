services:
  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # Hardening (docs/superpowers/specs/2026-09-14-deployment-design.md §5.4).
    # Read-only root; the only writable places are data/, /scratch and a small /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # CPU is throttled, never killed. There is deliberately NO memory limit: an
    # OOM kill of the one irreplaceable process costs ticks that cannot be
    # re-fetched, and Docker Desktop's VM already bounds memory.
    cpus: "1.0"
    pids_limit: 256
    volumes:
      - ../data:/app/data
      # Snapshots for analysis go here, never to /tmp (docker/README.md).
      - ../../parkcast-scratch:/scratch
    environment:
      TZ: Asia/Taipei
      PARKCAST_UPLOAD_URL: https://parkcast.tpe-dev.workers.dev/artifacts/latest
      # Which cities this container collects. The code default is all six; this
      # is set to Taipei alone on purpose, because the spec's rollout (§9) and
      # the runbook in docs/state-of-play.md both start there and a first boot
      # after the merge must not turn six untried feeds on at once. Widen it
      # one step at a time -- "taipei,newtaipei", then the rest -- restarting
      # between steps; an unknown name stops the boot and names the valid ones.
      # See docs/sources.md, "Turning cities on".
      PARKCAST_CITIES: taipei
    secrets:
      - parkcast_upload_secret

secrets:
  parkcast_upload_secret:
    file: ./secrets/parkcast_upload_secret
